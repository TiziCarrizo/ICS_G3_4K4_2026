<div class="mp-container">

  <div class="mp-card">

    <div class="mp-header">
      <h1>Mercado Pago</h1>
    </div>

    <h2>Completar pago</h2>

    <div class="form-group">
      <label>Número de tarjeta</label>

      <input
        type="text"
        maxlength="16"
        [(ngModel)]="numeroTarjeta"
        placeholder="4509953566233704">
    </div>

    <div class="form-group">
      <label>Titular</label>

      <input
        type="text"
        maxlength="30"
        [(ngModel)]="titular"
        placeholder="Juan Pérez">
    </div>

    <div class="row">

      <div class="form-group">
        <label>Vencimiento</label>

        <input
          type="text"
          maxlength="5"
          [(ngModel)]="vencimiento"
          (input)="formatearVencimiento()"
          placeholder="12/30">
      </div>

      <div class="form-group">
        <label>CVV</label>

        <input
          type="password"
          maxlength="3"
          [(ngModel)]="cvv"
          placeholder="123">
      </div>

    </div>

    <button
      class="btn-pagar"
      (click)="pagar()"
      [disabled]="procesando">

      <span *ngIf="!procesando">
        Pagar
      </span>

      <span *ngIf="procesando">
        Procesando pago...
      </span>

    </button>

    <div *ngIf="pagoExitoso" class="mensaje-exito">
      ✅ Pago realizado con éxito
      <br>
      Redirigiendo a Mis Compras...
    </div>

    <div class="seguridad">
      🔒 Pago protegido por Mercado Pago
    </div>

  </div>

</div>
